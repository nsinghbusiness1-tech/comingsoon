<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Apex Polychem Pvt Ltd — Our new website is coming soon." />
  <meta name="theme-color" content="#0b3d91" />
  <title>Apex Polychem Pvt Ltd | Coming Soon</title>

  <style>
    :root {
      --blue: #073b8f;
      --blue-dark: #052c6b;
      --green: #38a51f;
      --green-dark: #197b20;
      --text: #142033;
      --muted: #667085;
      --white: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(56, 165, 31, 0.08), transparent 30%),
        radial-gradient(circle at 90% 90%, rgba(7, 59, 143, 0.10), transparent 35%),
        linear-gradient(135deg, #ffffff 0%, #f7faff 50%, #ffffff 100%);
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Decorative background shapes */
    .shape {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(1px);
    }

    .shape.one {
      width: 360px;
      height: 360px;
      top: -190px;
      right: -120px;
      background: rgba(56, 165, 31, 0.07);
    }

    .shape.two {
      width: 300px;
      height: 300px;
      bottom: -170px;
      left: -130px;
      background: rgba(7, 59, 143, 0.07);
    }

    header {
      width: 100%;
      padding: 24px 6%;
      position: relative;
      z-index: 2;
    }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }

    .mini-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mini-brand img {
      width: 58px;
      height: 58px;
      object-fit: contain;
    }

    .mini-brand-text {
      line-height: 1.15;
    }

    .mini-brand-text strong {
      display: block;
      color: var(--blue);
      font-size: 16px;
      letter-spacing: 1.4px;
    }

    .mini-brand-text span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      margin-top: 5px;
      letter-spacing: 2.2px;
    }

    main {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      position: relative;
      z-index: 1;
      padding: 35px 6% 65px;
    }

    .hero {
      width: min(1180px, 100%);
      margin: 0 auto;
      text-align: center;
    }

    .logo-wrap {
      width: min(340px, 72vw);
      margin: 0 auto 28px;
      animation: logoFloat 5s ease-in-out infinite;
    }

    .logo-wrap img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 16px 28px rgba(7, 59, 143, 0.12));
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(7, 59, 143, 0.06);
      border: 1px solid rgba(7, 59, 143, 0.10);
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .eyebrow::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 5px rgba(56, 165, 31, 0.10);
    }

    h1 {
      font-size: clamp(42px, 6vw, 82px);
      line-height: 0.98;
      letter-spacing: -2.8px;
      color: var(--blue-dark);
      font-weight: 800;
      margin-bottom: 20px;
    }

    h1 .green {
      color: var(--green-dark);
    }

    .subtitle {
      max-width: 720px;
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 19px);
      line-height: 1.7;
    }

    .divider {
      width: 90px;
      height: 4px;
      margin: 30px auto;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--blue), var(--green));
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
      padding: 13px 20px;
      border-radius: 12px;
      background: var(--white);
      border: 1px solid rgba(7, 59, 143, 0.10);
      box-shadow: 0 12px 35px rgba(24, 55, 90, 0.08);
      color: #344054;
      font-size: 14px;
      font-weight: 600;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 0 5px rgba(56, 165, 31, 0.12);
      animation: pulse 2s infinite;
    }

    footer {
      position: relative;
      z-index: 2;
      padding: 20px 6% 28px;
      text-align: center;
      color: #8a94a6;
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    footer strong {
      color: var(--blue);
    }

    @keyframes logoFloat {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 0 0 5px rgba(56, 165, 31, 0.12);
      }
      50% {
        box-shadow: 0 0 0 9px rgba(56, 165, 31, 0.03);
      }
    }

    @media (max-width: 700px) {
      header {
        padding: 18px 5%;
      }

      .header-inner {
        justify-content: center;
      }

      .mini-brand img {
        width: 46px;
        height: 46px;
      }

      .mini-brand-text strong {
        font-size: 13px;
      }

      .mini-brand-text span {
        font-size: 8px;
        letter-spacing: 1.6px;
      }

      main {
        padding: 20px 6% 35px;
      }

      .logo-wrap {
        width: min(260px, 70vw);
        margin-bottom: 22px;
      }

      .eyebrow {
        font-size: 10px;
        letter-spacing: 1.5px;
        padding: 7px 13px;
      }

      h1 {
        letter-spacing: -1.5px;
        margin-bottom: 16px;
      }

      .subtitle {
        font-size: 15px;
        line-height: 1.6;
      }

      .divider {
        margin: 22px auto;
      }

      .status {
        font-size: 12px;
        padding: 11px 15px;
      }

      footer {
        padding-bottom: 20px;
      }
    }

    @media (max-width: 380px) {
      .mini-brand-text span {
        display: none;
      }

      .logo-wrap {
        width: 220px;
      }

      h1 {
        font-size: 38px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo-wrap,
      .status-dot {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="shape one"></div>
    <div class="shape two"></div>

    <header>
      <div class="header-inner">
        <div class="mini-brand">
          <img src="logo.png" alt="Apex Polychem Pvt Ltd logo">
          <div class="mini-brand-text">
            <strong>APEX POLYCHEM</strong>
            <span>POLY CHEM PVT LTD</span>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="hero" aria-labelledby="coming-soon-title">
        <div class="logo-wrap">
          <img src="logo.png" alt="Apex Polychem Pvt Ltd">
        </div>

        <div class="eyebrow">Website Under Development</div>

        <h1 id="coming-soon-title">
          Something Great<br>
          <span class="green">Is Coming Soon.</span>
        </h1>

        <p class="subtitle">
          We are building a new digital experience for
          <strong>Apex Polychem Pvt Ltd</strong>.
          Our website will be launching soon.
        </p>

        <div class="divider"></div>

        <div class="status">
          <span class="status-dot"></span>
          Our new website is currently under development
        </div>
      </section>
    </main>

    <footer>
      © <span id="year"></span> <strong>Apex Polychem Pvt Ltd</strong>. All rights reserved.
    </footer>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta
    name="description"
    content="Apex Polychem Pvt Ltd — Our new website is coming soon."
  />

  <meta name="theme-color" content="#073b8f" />

  <title>Apex Polychem Pvt Ltd | Coming Soon</title>

  <style>
    /* =========================================================
       ROOT VARIABLES
    ========================================================= */

    :root {
      --blue: #073b8f;
      --blue-dark: #052c6b;

      --green: #38a51f;
      --green-dark: #197b20;

      --text: #142033;
      --muted: #667085;

      --white: #ffffff;
    }


    /* =========================================================
       RESET
    ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }


    /* =========================================================
       BODY
    ========================================================= */

    body {
      min-height: 100vh;

      font-family: Arial, Helvetica, sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(56, 165, 31, 0.08),
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 90%,
          rgba(7, 59, 143, 0.10),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #ffffff 0%,
          #f7faff 50%,
          #ffffff 100%
        );

      overflow-x: hidden;
    }


    /* =========================================================
       PAGE
    ========================================================= */

    .page {
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      position: relative;
    }


    /* =========================================================
       DECORATIVE BACKGROUND SHAPES
    ========================================================= */

    .shape {
      position: fixed;

      border-radius: 50%;

      pointer-events: none;

      z-index: 0;

      filter: blur(1px);
    }

    .shape.one {
      width: 360px;
      height: 360px;

      top: -190px;
      right: -120px;

      background: rgba(56, 165, 31, 0.07);
    }

    .shape.two {
      width: 300px;
      height: 300px;

      bottom: -170px;
      left: -130px;

      background: rgba(7, 59, 143, 0.07);
    }


    /* =========================================================
       HEADER
    ========================================================= */

    header {
      width: 100%;

      padding: 24px 6%;

      position: relative;

      z-index: 2;
    }

    .header-inner {
      max-width: 1280px;

      margin: 0 auto;

      display: flex;

      justify-content: flex-start;

      align-items: center;
    }

    .mini-brand {
      display: flex;

      align-items: center;

      gap: 12px;
    }

    .mini-brand img {
      width: 58px;
      height: 58px;

      object-fit: contain;
    }

    .mini-brand-text {
      line-height: 1.15;
    }

    .mini-brand-text strong {
      display: block;

      color: var(--blue);

      font-size: 16px;

      letter-spacing: 1.4px;
    }

    .mini-brand-text span {
      display: block;

      color: var(--muted);

      font-size: 10px;

      margin-top: 5px;

      letter-spacing: 2.2px;
    }


    /* =========================================================
       MAIN CONTENT
    ========================================================= */

    main {
      flex: 1;

      width: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

      position: relative;

      z-index: 1;

      padding: 20px 6% 50px;
    }

    .hero {
      width: min(1000px, 100%);

      margin: 0 auto;

      text-align: center;

      display: flex;

      flex-direction: column;

      align-items: center;
    }


    /* =========================================================
       ANIMATED CHEMISTRY FLASK
    ========================================================= */

    .flask {
      display: block;

      width: 260px;
      height: 260px;

      margin: 0 auto 15px;

      filter:
        drop-shadow(
          0 15px 22px rgba(7, 59, 143, 0.12)
        );
    }


    /* Moving liquid */

    .liquid {
      transform-origin: 130px 184px;

      animation:
        liquidMove 3s ease-in-out infinite;
    }


    /* Moving surface wave */

    .wave {
      animation:
        waveMove 2.2s ease-in-out infinite;
    }


    /* Rising bubbles */

    .bubble {
      fill: var(--white);

      stroke: var(--blue);

      stroke-width: 2;

      transform-box: fill-box;

      transform-origin: center;

      animation:
        bubbleRise 2.8s ease-in infinite;
    }

    .bubble.b2 {
      animation-delay: 0.7s;

      animation-duration: 3.4s;
    }

    .bubble.b3 {
      animation-delay: 1.3s;

      animation-duration: 2.5s;
    }

    .bubble.b4 {
      animation-delay: 1.9s;

      animation-duration: 3.1s;
    }


    /* Small chemical particles */

    .spark {
      transform-origin: center;

      animation:
        sparkle 1.8s ease-in-out infinite;
    }

    .spark.s2 {
      animation-delay: 0.6s;
    }

    .spark.s3 {
      animation-delay: 1.1s;
    }


    /* =========================================================
       WEBSITE UNDER DEVELOPMENT BADGE
    ========================================================= */

    .eyebrow {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      padding: 8px 16px;

      margin: 0 auto 18px;

      border-radius: 999px;

      background: rgba(7, 59, 143, 0.06);

      border: 1px solid rgba(7, 59, 143, 0.10);

      color: var(--blue);

      font-size: 12px;

      font-weight: 700;

      letter-spacing: 2.2px;

      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";

      width: 7px;
      height: 7px;

      flex-shrink: 0;

      border-radius: 50%;

      background: var(--green);

      box-shadow:
        0 0 0 5px rgba(56, 165, 31, 0.10);
    }


    /* =========================================================
       MAIN HEADING
    ========================================================= */

    h1 {
      font-size: clamp(42px, 6vw, 82px);

      line-height: 0.98;

      letter-spacing: -2.8px;

      color: var(--blue-dark);

      font-weight: 800;

      margin-bottom: 20px;
    }

    h1 .green {
      color: var(--green-dark);
    }


    /* =========================================================
       DESCRIPTION
    ========================================================= */

    .subtitle {
      max-width: 720px;

      margin: 0 auto;

      color: var(--muted);

      font-size: clamp(16px, 2vw, 19px);

      line-height: 1.7;
    }


    /* =========================================================
       DIVIDER
    ========================================================= */

    .divider {
      width: 90px;

      height: 4px;

      margin: 30px auto;

      border-radius: 99px;

      background:
        linear-gradient(
          90deg,
          var(--blue),
          var(--green)
        );
    }


    /* =========================================================
       STATUS
    ========================================================= */

    .status {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      margin-top: 6px;

      padding: 13px 20px;

      border-radius: 12px;

      background: var(--white);

      border:
        1px solid rgba(7, 59, 143, 0.10);

      box-shadow:
        0 12px 35px rgba(24, 55, 90, 0.08);

      color: #344054;

      font-size: 14px;

      font-weight: 600;
    }

    .status-dot {
      width: 9px;
      height: 9px;

      flex-shrink: 0;

      background: var(--green);

      border-radius: 50%;

      box-shadow:
        0 0 0 5px rgba(56, 165, 31, 0.12);

      animation:
        pulse 2s infinite;
    }


    /* =========================================================
       FOOTER
    ========================================================= */

    footer {
      position: relative;

      z-index: 2;

      padding: 20px 6% 28px;

      text-align: center;

      color: #8a94a6;

      font-size: 12px;

      letter-spacing: 0.5px;
    }

    footer strong {
      color: var(--blue);
    }


    /* =========================================================
       ANIMATIONS
    ========================================================= */

    @keyframes bubbleRise {

      0% {
        opacity: 0;

        transform:
          translateY(18px)
          scale(0.4);
      }

      15% {
        opacity: 1;
      }

      70% {
        opacity: 0.85;
      }

      100% {
        opacity: 0;

        transform:
          translateY(-90px)
          scale(1);
      }
    }


    @keyframes liquidMove {

      0%,
      100% {
        transform:
          rotate(-1deg)
          scaleY(1);
      }

      50% {
        transform:
          rotate(1deg)
          scaleY(1.03);
      }
    }


    @keyframes waveMove {

      0%,
      100% {
        transform: translateX(-5px);
      }

      50% {
        transform: translateX(5px);
      }
    }


    @keyframes sparkle {

      0%,
      100% {
        opacity: 0.3;

        transform: scale(0.7);
      }

      50% {
        opacity: 1;

        transform: scale(1.2);
      }
    }


    @keyframes pulse {

      0%,
      100% {
        box-shadow:
          0 0 0 5px rgba(56, 165, 31, 0.12);
      }

      50% {
        box-shadow:
          0 0 0 9px rgba(56, 165, 31, 0.03);
      }
    }


    /* =========================================================
       TABLET / MOBILE
    ========================================================= */

    @media (max-width: 700px) {

      header {
        padding: 18px 5%;
      }

      .header-inner {
        justify-content: center;
      }

      .mini-brand img {
        width: 46px;
        height: 46px;
      }

      .mini-brand-text strong {
        font-size: 13px;
      }

      .mini-brand-text span {
        font-size: 8px;

        letter-spacing: 1.6px;
      }

      main {
        padding: 10px 6% 35px;
      }

      .flask {
        width: 220px;
        height: 220px;

        margin-bottom: 12px;
      }

      .eyebrow {
        font-size: 10px;

        letter-spacing: 1.5px;

        padding: 7px 13px;

        margin-bottom: 16px;
      }

      h1 {
        font-size: clamp(38px, 10vw, 55px);

        letter-spacing: -1.5px;

        margin-bottom: 16px;
      }

      .subtitle {
        font-size: 15px;

        line-height: 1.6;
      }

      .divider {
        margin: 22px auto;
      }

      .status {
        font-size: 12px;

        padding: 11px 15px;
      }

      footer {
        padding-bottom: 20px;
      }
    }


    /* =========================================================
       SMALL MOBILE
    ========================================================= */

    @media (max-width: 380px) {

      .mini-brand-text span {
        display: none;
      }

      .flask {
        width: 195px;
        height: 195px;
      }

      h1 {
        font-size: 38px;
      }
    }


    /* =========================================================
       REDUCED MOTION ACCESSIBILITY
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      .liquid,
      .wave,
      .bubble,
      .spark,
      .status-dot {
        animation: none;
      }
    }

  </style>
</head>


<body>

  <div class="page">

    <!-- =====================================================
         BACKGROUND DECORATIONS
    ====================================================== -->

    <div class="shape one"></div>
    <div class="shape two"></div>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>

      <div class="header-inner">

        <div class="mini-brand">

          <img
            src="logo.png"
            alt="Apex Polychem Pvt Ltd logo"
          />

          <div class="mini-brand-text">

            <strong>
              APEX POLYCHEM
            </strong>

            <span>
              POLY CHEM PVT LTD
            </span>

          </div>

        </div>

      </div>

    </header>


    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main>

      <section
        class="hero"
        aria-labelledby="coming-soon-title"
      >


        <!-- =================================================
             ANIMATED CHEMISTRY FLASK
        ================================================== -->

        <svg
          class="flask"
          viewBox="0 0 260 260"
          role="img"
          aria-label="Animated laboratory flask with bubbling chemical liquid"
        >

          <defs>

            <!-- Glass gradient -->

            <linearGradient
              id="glass"
              x1="0"
              y1="0"
              x2="1"
              y2="1"
            >

              <stop
                offset="0"
                stop-color="#073b8f"
              />

              <stop
                offset=".5"
                stop-color="#1e6cc8"
              />

              <stop
                offset="1"
                stop-color="#38a51f"
              />

            </linearGradient>


            <!-- Chemical gradient -->

            <linearGradient
              id="chem"
              x1="0"
              y1="0"
              x2="0"
              y2="1"
            >

              <stop
                offset="0"
                stop-color="#38a51f"
              />

              <stop
                offset=".45"
                stop-color="#168b32"
              />

              <stop
                offset="1"
                stop-color="#073b8f"
              />

            </linearGradient>


            <!-- Flask clipping area -->

            <clipPath id="flaskClip">

              <path
                d="
                  M105 34
                  h50
                  v71
                  l48 89
                  c11 20-4 38-26 38
                  H83
                  c-22 0-37-18-26-38
                  l48-89
                  V34z
                "
              />

            </clipPath>

          </defs>


          <!-- Flask outer body -->

          <path
            d="
              M105 34
              h50
              v71
              l48 89
              c11 20-4 38-26 38
              H83
              c-22 0-37-18-26-38
              l48-89
              V34z
            "
            fill="rgba(255,255,255,.65)"
            stroke="url(#glass)"
            stroke-width="7"
            stroke-linejoin="round"
          />


          <!-- Glass highlight -->

          <path
            d="
              M114 45
              v63
              l-49 90
            "
            fill="none"
            stroke="#ffffff"
            stroke-opacity=".8"
            stroke-width="5"
            stroke-linecap="round"
          />


          <!-- =================================================
               CHEMICAL LIQUID
          ================================================== -->

          <g clip-path="url(#flaskClip)">

            <g class="liquid">

              <!-- Liquid body -->

              <path
                d="
                  M35 181
                  c30-13 43 10 67 0
                  c24-11 34 12 58 0
                  c25-12 37 9 65-2
                  v75
                  H35z
                "
                fill="url(#chem)"
              />


              <!-- Moving liquid surface -->

              <path
                class="wave"
                d="
                  M38 177
                  c31-13 42 11 67 0
                  c25-11 32 13 57 1
                  c26-12 37 9 60-2
                "
                fill="none"
                stroke="#7bd35d"
                stroke-width="5"
                stroke-linecap="round"
              />

            </g>


            <!-- Rising bubbles -->

            <circle
              class="bubble"
              cx="107"
              cy="183"
              r="7"
            />

            <circle
              class="bubble b2"
              cx="144"
              cy="194"
              r="5"
            />

            <circle
              class="bubble b3"
              cx="126"
              cy="175"
              r="4"
            />

            <circle
              class="bubble b4"
              cx="161"
              cy="186"
              r="3.5"
            />

          </g>


          <!-- Chemical particles -->

          <circle
            class="spark"
            cx="119"
            cy="144"
            r="4"
            fill="#073b8f"
          />

          <circle
            class="spark s2"
            cx="145"
            cy="126"
            r="3"
            fill="#38a51f"
          />

          <circle
            class="spark s3"
            cx="132"
            cy="105"
            r="2.5"
            fill="#073b8f"
          />


          <!-- Flask shine -->

          <path
            d="
              M82 216
              c21 8 75 8 96-1
            "
            fill="none"
            stroke="#ffffff"
            stroke-opacity=".75"
            stroke-width="4"
            stroke-linecap="round"
          />

        </svg>


        <!-- =================================================
             WEBSITE UNDER DEVELOPMENT
        ================================================== -->

        <div class="eyebrow">
          Website Under Development
        </div>


        <!-- =================================================
             MAIN HEADING
        ================================================== -->

        <h1 id="coming-soon-title">

          Something Great
          <br />

          <span class="green">
            Is Coming Soon.
          </span>

        </h1>


        <!-- =================================================
             DESCRIPTION
        ================================================== -->

        <p class="subtitle">

          We are building a new digital experience for

          <strong>
            Apex Polychem Pvt Ltd
          </strong>.

          Our website will be launching soon.

        </p>


        <!-- =================================================
             DIVIDER
        ================================================== -->

        <div class="divider"></div>


        <!-- =================================================
             STATUS
        ================================================== -->

        <div class="status">

          <span class="status-dot"></span>

          Our new website is currently under development

        </div>

      </section>

    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer>

      ©
      <span id="year"></span>

      <strong>
        Apex Polychem Pvt Ltd
      </strong>.

      All rights reserved.

    </footer>

  </div>


  <!-- =======================================================
       JAVASCRIPT
  ======================================================== -->

  <script>

    document.getElementById("year").textContent =
      new Date().getFullYear();

  </script>

</body>
</html>
